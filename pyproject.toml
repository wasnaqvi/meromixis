[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meromixis"
version = "0.1.0"
description = "Cold traps and chemoclines in temperate sub-Neptune atmospheres: one Generic PCM sweep, two results."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Wasi Naqvi"}]
dependencies = ["numpy>=2.0", "scipy>=1.11", "xarray>=2024.1", "netCDF4", "pyyaml", "matplotlib>=3.8", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
thermo = ["cantera>=3.0"]

[project.scripts]
meromixis = "meromixis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731", "E501"]
